  // -------- Game logic --------
  function updateBoat(dt) {
    let ax = 0, ay = 0;
    const accel = 0.12;
    if (keys['arrowup'] || keys['w']) ay -= 1;
    if (keys['arrowdown'] || keys['s']) ay += 1;
    if (keys['arrowleft'] || keys['a']) ax -= 1;
    if (keys['arrowright'] || keys['d']) ax += 1;

    let usingKeys = (ax !== 0 || ay !== 0);
    const joyActive = joystick.active && (joystick.dx !== 0 || joystick.dy !== 0);
    // Any manual input cancels auto-sail
    if (usingKeys || joyActive || state.target) state.autoSailTarget = null;

    if (usingKeys) {
      state.target = null;
      const m = Math.hypot(ax, ay) || 1;
      boat.vx += (ax / m) * accel;
      boat.vy += (ay / m) * accel;
    } else if (joyActive) {
      state.target = null;
      const m = Math.hypot(joystick.dx, joystick.dy) || 1;
      const mag = Math.min(1, m);
      boat.vx += (joystick.dx / m) * accel * mag;
      boat.vy += (joystick.dy / m) * accel * mag;
    } else if (state.target) {
      const dx = state.target.x - boat.x;
      const dy = state.target.y - boat.y;
      const d = Math.hypot(dx, dy);
      if (d < 8) state.target = null;
      else {
        boat.vx += (dx / d) * accel;
        boat.vy += (dy / d) * accel;
      }
    } else if (state.autoSailTarget) {
      // Auto-sail to an island (from quick-travel buttons)
      const isl = state.autoSailTarget;
      const dx = isl.x - boat.x, dy = isl.y - boat.y;
      const d = Math.hypot(dx, dy);
      if (d < isl.r + 30) {
        state.autoSailTarget = null;
        updateIslandBar();
      } else {
        boat.vx += (dx / d) * accel;
        boat.vy += (dy / d) * accel;
        // Steer around other islands in the way
        for (const o of islands) {
          if (o === isl || !o.unlocked) continue;
          const adx = boat.x - o.x, ady = boat.y - o.y;
          const ad = Math.hypot(adx, ady);
          if (ad < o.r + 80) {
            const f = (o.r + 80 - ad) * 0.012;
            boat.vx += (adx / ad) * f;
            boat.vy += (ady / ad) * f;
          }
        }
      }
    } else {
      boat.vx *= 0.94; boat.vy *= 0.94;
    }

    const sp = Math.hypot(boat.vx, boat.vy);
    const maxS = speedMax();
    if (sp > maxS) {
      boat.vx = (boat.vx / sp) * maxS;
      boat.vy = (boat.vy / sp) * maxS;
    }
    boat.vx *= 0.985; boat.vy *= 0.985;
    boat.x += boat.vx; boat.y += boat.vy;

    // World bounds
    const m = 30;
    if (boat.x < m) { boat.x = m; boat.vx = Math.abs(boat.vx) * 0.4; }
    if (boat.y < m) { boat.y = m; boat.vy = Math.abs(boat.vy) * 0.4; }
    if (boat.x > WORLD_W - m) { boat.x = WORLD_W - m; boat.vx = -Math.abs(boat.vx) * 0.4; }
    if (boat.y > WORLD_H - m) { boat.y = WORLD_H - m; boat.vy = -Math.abs(boat.vy) * 0.4; }

    // Push away from each island's land — gentle bonk for kids
    for (const isl of islands) {
      const dx = boat.x - isl.x, dy = boat.y - isl.y;
      const d = Math.hypot(dx, dy);
      const landR = isl.r * 0.85;
      if (d < landR) {
        const nx = dx / (d || 1), ny = dy / (d || 1);
        boat.x = isl.x + nx * landR;
        boat.y = isl.y + ny * landR;
        const sp = Math.hypot(boat.vx, boat.vy);
        boat.vx *= -0.3; boat.vy *= -0.3;
        const now = performance.now();
        if (sp > 0.6 && now - state.lastBonkAt > 350) {
          state.lastBonkAt = now;
          sfx.bonk();
        }
      }
    }

    const speed = Math.hypot(boat.vx, boat.vy);
    if (speed > 0.15) {
      boat.targetAngle = Math.atan2(boat.vy, boat.vx);
    }
    let diff = boat.targetAngle - boat.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const turn = diff * 0.12;
    boat.angle += turn;

    // Bank into turns; smooth back when straight
    const targetBank = clamp(-turn * 6, -0.6, 0.6) * Math.min(1, speed / 1.5);
    boat.bank += (targetBank - boat.bank) * 0.15;
    // Pitch up slightly when accelerating
    const targetPitch = clamp(speed / speedMax(), 0, 1) * 0.18;
    boat.pitch += (targetPitch - boat.pitch) * 0.08;

    // Drop wake foam behind the boat
    if (speed > 0.4) {
      const back = boat.angle + Math.PI;
      const sx = boat.x + Math.cos(back) * 24 * hullScale();
      const sy = boat.y + Math.sin(back) * 24 * hullScale();
      const spread = 6;
      wakeTrail.push({
        x: sx + rand(-spread, spread),
        y: sy + rand(-spread, spread),
        r: rand(6, 10) * hullScale(),
        life: 1,
      });
      if (wakeTrail.length > 80) wakeTrail.shift();
    }
  }

  function updateItems() {
    for (const it of state.items) it.bob += 0.04;
    const pR = pickupRange();
    const pR2 = pR * pR;
    const mR = magnetRange();
    const mR2 = mR * mR;
    const hasRoom = state.cargo.length < cargoMax();

    for (let i = state.items.length - 1; i >= 0; i--) {
      const it = state.items[i];
      const d2 = dist2(boat, it);

      // Magnet pull (only when we have room) — items fly to the boat
      if (hasRoom && d2 < mR2 && d2 > pR2) {
        const d = Math.sqrt(d2);
        const dx = boat.x - it.x, dy = boat.y - it.y;
        // Stronger pull the closer you are
        const strength = Math.pow(1 - (d - pR) / (mR - pR), 1.5) * 5.5;
        it.x += (dx / d) * strength;
        it.y += (dy / d) * strength;
      }

      if (d2 < pR2) {
        if (hasRoom) {
          state.cargo.push(it.type);
          state.totalCollected[it.type] = (state.totalCollected[it.type] || 0) + 1;
          const t = itemTypes[it.type];
          const col = t.rare ? '#fff176' : '#ffe082';
          const count = t.rare ? 26 : 10;
          for (let s = 0; s < count; s++) {
            state.sparkles.push({
              x: it.x, y: it.y,
              vx: rand(-2, 2), vy: rand(-3, -0.4),
              life: 1, color: col,
            });
          }
          spawnItemPop(it);
          spawnPopup(it.x, it.y, `+${t.value}g`, t.rare ? '#ffeb3b' : '#fff', t.rare);
          state.items.splice(i, 1);
          if (t.rare) {
            sfx.rare();
            showToast(`★ ${t.name}! +${t.value}g ★`);
            speak('Treasure!');
            shake(12, 24);
            cameraPunch();
            handleQuestEvent('collect_rare', it.type);
          } else {
            sfx.pickup();
            shake(2.5, 6);
          }
          registerCombo();
          handleQuestEvent('collect', it.type);
          checkAchievements();
          state.cargoFullWarned = false;
          // Advance tutorial step 0 -> 1
          if (state.tutorial.active && state.tutorial.step === 0) {
            state.tutorial.step = 1;
            speak('Now sail home!');
          }
          saveGame();
          setTimeout(() => { if (state.items.length < 40) spawnItem(); }, 700);
        } else {
          if (!state.cargoFullWarned) {
            state.cargoFullWarned = true;
            sfx.cargoFull();
            showMsg('Cargo full! Sail home!');
            speak('Sail home!');
          }
        }
      }
    }
  }

  function updateNPCs() {
    for (const c of state.clouds) {
      c.x += c.vx;
      if (c.x - c.r > WORLD_W) c.x = -c.r;
    }
    for (const w of state.waves) w.phase += 0.04;
    for (const f of state.fishes) {
      f.x += f.vx;
      f.bob += 0.08;
      if (f.x < -30) f.x = WORLD_W + 30;
      if (f.x > WORLD_W + 30) f.x = -30;
    }
    for (let i = state.sparkles.length - 1; i >= 0; i--) {
      const s = state.sparkles[i];
      s.x += s.vx; s.y += s.vy;
      s.vy += 0.08;
      s.life -= 0.025;
      if (s.life <= 0) state.sparkles.splice(i, 1);
    }
    // Wild creatures swim around
    for (const c of state.wildCreatures) {
      c.bob += 0.06;
      c.x += c.vx;
      c.y += c.vy;
      // Gentle wandering
      if (Math.random() < 0.01) {
        c.vx = rand(0.3, 0.7) * (Math.random() < 0.5 ? -1 : 1);
        c.vy = rand(-0.3, 0.3);
      }
      // Bounce off world edges
      if (c.x < 80 || c.x > WORLD_W - 80) c.vx *= -1;
      if (c.y < 80 || c.y > WORLD_H - 80) c.vy *= -1;
      // Avoid islands
      for (const isl of islands) {
        const dx = c.x - isl.x, dy = c.y - isl.y;
        const d = Math.hypot(dx, dy);
        if (d < isl.r + 30) {
          c.vx += (dx / (d || 1)) * 0.3;
          c.vy += (dy / (d || 1)) * 0.3;
        }
      }
      if (c.kind === 'dolphin') c.jumpT += 0.05;
    }

    // Check for near wild creatures (befriend prompt)
    let near = null;
    for (const c of state.wildCreatures) {
      if (dist2(boat, c) < 110 * 110 && !state.pets[c.kind]) {
        near = c; break;
      }
    }
    state.nearWild = near;
    const prompt = document.getElementById('befriend-prompt');
    if (near && !state.shopOpen && !state.miniGameOpen) {
      prompt.style.display = 'block';
      prompt.firstChild.textContent = near.kind === 'dolphin'
        ? 'Tap to befriend the dolphin! '
        : 'Tap to befriend the turtle! ';
    } else {
      prompt.style.display = 'none';
    }

    // Rare item spawning
    state.rareSpawnTimer--;
    if (state.rareSpawnTimer <= 0) {
      // Don't have too many rares at once
      const rareCount = state.items.filter(it => itemTypes[it.type].rare).length;
      if (rareCount < 2) spawnRareItem();
      state.rareSpawnTimer = Math.floor(rand(600, 1400)); // 10-23s
    }
  }

  function updateNPCShips() {
    for (const ship of npcShips) {
      ship.bob += 0.04;
      // Steer toward target island, but stop short of crashing in
      const dx = ship.target.x - ship.x;
      const dy = ship.target.y - ship.y;
      const d = Math.hypot(dx, dy) || 1;
      const approachDist = ship.target.r + 70;
      if (d < approachDist) {
        // Arrived — pick a new destination
        ship.target = pickShipDestination(ship.target);
      } else {
        ship.vx += (dx / d) * 0.06;
        ship.vy += (dy / d) * 0.06;
      }
      // Avoid land — every island repels at close range
      for (const isl of islands) {
        const adx = ship.x - isl.x, ady = ship.y - isl.y;
        const ad = Math.hypot(adx, ady) || 1;
        if (ad < isl.r + 65) {
          const f = (isl.r + 65 - ad) * 0.012;
          ship.vx += (adx / ad) * f;
          ship.vy += (ady / ad) * f;
        }
      }
      // Soft drag and speed cap
      ship.vx *= 0.985;
      ship.vy *= 0.985;
      const sp = Math.hypot(ship.vx, ship.vy);
      if (sp > ship.maxSpeed) {
        ship.vx = (ship.vx / sp) * ship.maxSpeed;
        ship.vy = (ship.vy / sp) * ship.maxSpeed;
      }
      ship.x += ship.vx;
      ship.y += ship.vy;
      // Face direction of travel
      if (sp > 0.1) ship.targetAngle = Math.atan2(ship.vy, ship.vx);
      let diff = ship.targetAngle - ship.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      ship.angle += diff * 0.07;

      // Drop wake foam into the shared trail
      if (sp > 0.3 && Math.random() < 0.45) {
        const back = ship.angle + Math.PI;
        const off = ship.type === 'voyager' ? 32 : 22;
        wakeTrail.push({
          x: ship.x + Math.cos(back) * off + rand(-3, 3),
          y: ship.y + Math.sin(back) * off + rand(-3, 3),
          r: rand(5, 8),
          life: 0.9,
        });
        if (wakeTrail.length > 160) wakeTrail.shift();
      }

      // Greeting when player gets close
      const d2 = dist2(boat, ship);
      if (d2 < 220 * 220 && !ship.greeted) {
        ship.greeted = true;
        ship.waveTimer = 140;
        speak(ship.greeting.replace(/[!ā]/g, m => m === 'ā' ? 'ah' : ''));
      } else if (d2 > 380 * 380) {
        ship.greeted = false;
      }
      if (ship.waveTimer > 0) ship.waveTimer--;
    }
  }

  function unlockCheck() {
    for (const isl of islands) {
      if (!isl.unlocked && isl.requires) {
        let ok = true;
        for (const [k, lvl] of Object.entries(isl.requires)) {
          if (state.upgrades[k].level < lvl) { ok = false; break; }
        }
        if (ok) {
          isl.unlocked = true;
          sfx.unlock();
          showToast(`New island: ${isl.name}!`);
          speak(`${isl.name} is open!`);
          updateIslandBar();
          saveGame();
        }
      }
    }
  }

  function checkIsland() {
    let near = null;
    for (const isl of islands) {
      if (!isl.unlocked) continue;
      const d = Math.hypot(boat.x - isl.x, boat.y - isl.y);
      if (d < isl.r + 35) { near = isl; break; }
    }
    const wasNear = state.nearIsland;
    if (near && near !== wasNear) {
      state.nearIsland = near;
      state.islandsVisited[near.id] = true;
      // Sell cargo
      if (state.cargo.length > 0) {
        let earned = 0;
        for (const c of state.cargo) earned += itemTypes[c].value;
        state.gold += earned;
        state.cargo = [];
        state.cargoFullWarned = false;
        sfx.sell();
        showMsg(`Sold cargo for ${earned} gold!`);
        speak(`${earned} gold!`);
        spawnCoinShower(earned);
        spawnPopup(boat.x, boat.y, `+${earned} GOLD!`, '#ffeb3b', true);
        shake(5, 14);
        saveGame();
        handleQuestEvent('sell');
      }
      handleQuestEvent('visit', near.id);
      checkAchievements();
      // Advance tutorial step 1 -> 2
      if (state.tutorial.active && state.tutorial.step === 1) {
        state.tutorial.step = 2;
        setTimeout(() => speak('Buy something new!'), 900);
      }
      openShop(near);
    } else if (!near) {
      state.nearIsland = null;
    }
  }

  // -------- Drawing --------
  function updateCamera() {
    const targetX = boat.x - W / 2;
    // Position boat slightly below screen center so we see more "ahead"
    const targetY = boat.y - (H * 0.55) / TILT;
    cam.x += (targetX - cam.x) * 0.1;
    cam.y += (targetY - cam.y) * 0.1;
    cam.x = clamp(cam.x, 0, WORLD_W - W);
    const maxCamY = WORLD_H - H / TILT;
    cam.y = clamp(cam.y, 0, Math.max(0, maxCamY));
    if (WORLD_W < W) cam.x = (WORLD_W - W) / 2;
    if (WORLD_H * TILT < H) cam.y = (WORLD_H - H / TILT) / 2;
  }

  function drawOcean() {
    // Deep water with vertical gradient for depth
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#4fc3f7');
    g.addColorStop(0.5, '#29b6f6');
    g.addColorStop(1, '#01579b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Animated caustic stripes — give the water a shimmering depth
    const t = performance.now() / 1000;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 18;
    for (let i = -2; i < 12; i++) {
      const yBase = (i * 110 + (t * 14) % 110) - cam.y * 0.4 % 110;
      ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 30) {
        const y = yBase + Math.sin((x + cam.x) * 0.012 + t * 0.8) * 12
                        + Math.cos((x + cam.x) * 0.005 + t * 0.4) * 6;
        if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();

    // Sun glints from upper-left direction
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(0, 0, W, H * 0.35);

    // Cloud shadows drifting on the water (projected onto tilted plane)
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    for (const c of state.clouds) {
      const sx = c.x - cam.x * 0.85 + 30;
      const sy = projY(c.y) + 80;
      if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;
      const grd = ctx.createRadialGradient(sx, sy, c.r * 0.2, sx, sy, c.r * 1.3);
      grd.addColorStop(0, 'rgba(60, 90, 120, 0.55)');
      grd.addColorStop(1, 'rgba(60, 90, 120, 0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.ellipse(sx, sy, c.r * 1.3, c.r * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Wave highlights (projected to tilted plane)
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    for (const w of state.waves) {
      const sx = w.x - cam.x, sy = projY(w.y);
      if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) continue;
      const a = Math.sin(w.phase) * 0.35 + 0.5;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.moveTo(sx - w.r * 0.5, sy);
      ctx.quadraticCurveTo(sx, sy - 3, sx + w.r * 0.5, sy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Distance haze — atmospheric perspective near the horizon (top of view)
    const haze = ctx.createLinearGradient(0, 0, 0, H * 0.55);
    haze.addColorStop(0, 'rgba(180, 220, 255, 0.35)');
    haze.addColorStop(1, 'rgba(180, 220, 255, 0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H * 0.55);
  }

  function drawWakeTrail() {
    for (let i = wakeTrail.length - 1; i >= 0; i--) {
      const w = wakeTrail[i];
      w.life -= 0.018;
      w.r *= 1.012;
      if (w.life <= 0) { wakeTrail.splice(i, 1); continue; }
      const sx = w.x - cam.x, sy = projY(w.y);
      ctx.globalAlpha = w.life * 0.55;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(sx, sy, w.r * w.life, w.r * w.life * TILT, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Drop-shadow helper for any object — gives 3D grounding
  function drawShadow(sx, sy, rx, ry) {
    ctx.fillStyle = 'rgba(0, 30, 60, 0.35)';
    ctx.beginPath();
    ctx.ellipse(sx + 4, sy + 4, rx, ry * TILT, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawIslands() {
    // Sort by world Y so further islands draw first (painter's algorithm)
    const sorted = islands.slice().sort((a, b) => a.y - b.y);
    for (const isl of sorted) {
      const sx = isl.x - cam.x, sy = projY(isl.y);
      if (sx < -200 || sx > W + 200 || sy < -250 || sy > H + 200) continue;
      const ry = isl.r * TILT;

      // If locked, draw misty/silhouette (also squashed)
      if (!isl.unlocked) {
        ctx.fillStyle = 'rgba(60, 80, 100, 0.55)';
        ctx.beginPath();
        ctx.ellipse(sx, sy, isl.r, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(40, 60, 80, 0.6)';
        ctx.beginPath();
        ctx.ellipse(sx, sy - 8, isl.r * 0.7, ry * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = 'bold 12px Trebuchet MS';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.fillText('???', sx, sy - 8);
        let req = '';
        if (isl.requires) {
          for (const [k, lvl] of Object.entries(isl.requires)) {
            req = `Needs ${state.upgrades[k].name} Lv${lvl}`;
          }
        }
        ctx.fillText(req, sx, sy + ry + 14);
        continue;
      }

      // Underwater glow ring (shallow water around the island)
      const shallow = ctx.createRadialGradient(sx, sy, isl.r * 0.8, sx, sy, isl.r * 1.4);
      shallow.addColorStop(0, 'rgba(255, 245, 200, 0.35)');
      shallow.addColorStop(1, 'rgba(255, 245, 200, 0)');
      ctx.fillStyle = shallow;
      ctx.beginPath();
      ctx.ellipse(sx, sy, isl.r * 1.4, ry * 1.4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Island drop shadow on the water (offset SE)
      ctx.fillStyle = 'rgba(0, 30, 60, 0.35)';
      ctx.beginPath();
      ctx.ellipse(sx + 10, sy + 8, isl.r * 1.02, ry * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sand "cliff" — vertical band of sand from water level up to the dome top.
      // Gives the island actual visible elevation.
      const elev = isl.r * 0.18; // how tall the cliff appears in screen pixels
      ctx.fillStyle = '#d7b46a';
      ctx.beginPath();
      ctx.ellipse(sx, sy + elev, isl.r, ry, 0, 0, Math.PI, false);
      ctx.ellipse(sx, sy, isl.r, ry, 0, Math.PI, 0, true);
      ctx.closePath();
      ctx.fill();

      // Sand top (the actual beach surface) — squashed ellipse
      ctx.fillStyle = isl.sand;
      ctx.beginPath();
      ctx.ellipse(sx, sy, isl.r, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      // Sand directional shading
      const sandShade = ctx.createRadialGradient(sx - isl.r * 0.4, sy - ry * 0.4, isl.r * 0.2,
                                                  sx + isl.r * 0.3, sy + ry * 0.3, isl.r);
      sandShade.addColorStop(0, 'rgba(255,255,255,0)');
      sandShade.addColorStop(1, 'rgba(60, 40, 20, 0.35)');
      ctx.fillStyle = sandShade;
      ctx.beginPath();
      ctx.ellipse(sx, sy, isl.r, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      // Grass dome top — sits slightly higher in screen Y to look raised
      const grassLift = isl.r * 0.12;
      ctx.fillStyle = isl.grass;
      ctx.beginPath();
      ctx.ellipse(sx - 2, sy - grassLift, isl.r * 0.78, ry * 0.78, 0, 0, Math.PI * 2);
      ctx.fill();

      // Inner darker dome (raised higher again)
      ctx.fillStyle = isl.innerGrass;
      ctx.beginPath();
      ctx.ellipse(sx - 6, sy - grassLift - 6, isl.r * 0.55, ry * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sun highlight on NW side of dome
      const hl = ctx.createRadialGradient(sx - isl.r * 0.35, sy - grassLift - ry * 0.45, 2,
                                          sx - isl.r * 0.35, sy - grassLift - ry * 0.45, isl.r * 0.7);
      hl.addColorStop(0, 'rgba(255,255,255,0.5)');
      hl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hl;
      ctx.beginPath();
      ctx.ellipse(sx - 6, sy - grassLift - 6, isl.r * 0.7, ry * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Per-island art (palms, hut, volcano cone) sits on top of the
      // raised dome. Translate up so tall features stand on the grass.
      ctx.save();
      ctx.translate(0, -grassLift - 6);

      if (isl.id === 'home') {
        drawPalm(sx - 30, sy - 28, 1);
        drawPalm(sx + 25, sy + 10, 0.85);
        drawPalm(sx + 5, sy - 45, 1.1);
        // Grandma Moana waves from beside the hut
        drawGrandma(sx + 22, sy + 10);
        // hut
        const hx = sx - 5, hy = sy + 25;
        ctx.fillStyle = '#6d4c41';
        ctx.fillRect(hx - 14, hy - 6, 28, 18);
        ctx.fillStyle = '#a1887f';
        ctx.fillRect(hx - 4, hy + 2, 8, 10);
        ctx.fillStyle = '#5d4037';
        ctx.beginPath();
        ctx.moveTo(hx - 18, hy - 6);
        ctx.lineTo(hx, hy - 20);
        ctx.lineTo(hx + 18, hy - 6);
        ctx.closePath();
        ctx.fill();
      } else if (isl.id === 'reef') {
        // Coral mounds
        drawPalm(sx - 20, sy - 20, 0.85);
        drawPalm(sx + 22, sy + 8, 0.95);
        ctx.fillStyle = '#ec407a';
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(sx + Math.cos(a) * 30, sy + Math.sin(a) * 30, 5, 0, Math.PI * 2);
          ctx.fill();
        }
        // Fishing pole hut
        ctx.fillStyle = '#6d4c41';
        ctx.fillRect(sx - 12, sy + 18, 24, 14);
        ctx.strokeStyle = '#bcaaa4';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx + 10, sy + 18);
        ctx.lineTo(sx + 26, sy + 4);
        ctx.stroke();
      } else if (isl.id === 'volcano') {
        // Volcano cone
        ctx.fillStyle = '#3e2723';
        ctx.beginPath();
        ctx.moveTo(sx - 35, sy + 20);
        ctx.lineTo(sx, sy - 50);
        ctx.lineTo(sx + 35, sy + 20);
        ctx.closePath();
        ctx.fill();
        // Lava top
        ctx.fillStyle = '#ff5722';
        ctx.beginPath();
        ctx.ellipse(sx, sy - 48, 8, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        // Smoke puff
        ctx.fillStyle = 'rgba(120,120,120,0.7)';
        ctx.beginPath();
        ctx.arc(sx + 2, sy - 60, 6, 0, Math.PI * 2);
        ctx.arc(sx - 4, sy - 65, 5, 0, Math.PI * 2);
        ctx.fill();
        // Lava streams
        ctx.strokeStyle = '#ff8a65';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx - 4, sy - 40);
        ctx.lineTo(sx - 18, sy + 12);
        ctx.moveTo(sx + 6, sy - 38);
        ctx.lineTo(sx + 22, sy + 14);
        ctx.stroke();
      } else if (isl.id === 'pearl') {
        // Pearl shells on the island
        drawPalm(sx - 20, sy - 20, 0.9);
        ctx.fillStyle = '#e1bee7';
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          ctx.arc(sx + rand(-30, 30), sy + rand(-15, 25), 5, 0, Math.PI * 2);
          ctx.fill();
        }
        // Glow
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.arc(sx, sy, isl.r * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore(); // end per-island art translate

      ctx.font = 'bold 14px Trebuchet MS';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#3e2723';
      ctx.fillText(isl.name, sx, sy + ry + 14);
    }
  }

  function drawPalm(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.strokeStyle = '#6d4c41';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.quadraticCurveTo(2, -8, -2, -24);
    ctx.stroke();
    ctx.fillStyle = '#43a047';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.save();
      ctx.translate(-2, -24);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(10, 0, 12, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#4e342e';
    ctx.beginPath(); ctx.arc(-4, -22, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -22, 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBoat() {
    const sx = boat.x - cam.x, sy = projY(boat.y);
    const scale = hullScale();
    // Drop shadow on the water (squashed, offset, not banked)
    ctx.save();
    ctx.translate(sx + 6, sy + 4);
    ctx.rotate(boat.angle);
    ctx.scale(scale, scale * TILT);
    ctx.fillStyle = 'rgba(0, 30, 60, 0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(boat.angle);
    // Apply bank (roll into turns) via Y-skew, and pitch (nose up) via X-scale
    ctx.transform(1 + boat.pitch * 0.1, 0, boat.bank * 0.3, 1 - Math.abs(boat.bank) * 0.18, 0, -boat.bank * 3);
    ctx.scale(scale, scale);

    ctx.fillStyle = '#6d4c41';
    ctx.beginPath();
    ctx.moveTo(28, 0);
    ctx.quadraticCurveTo(22, 12, -22, 9);
    ctx.quadraticCurveTo(-30, 0, -22, -9);
    ctx.quadraticCurveTo(22, -12, 28, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d84315';
    ctx.beginPath();
    ctx.moveTo(24, 0);
    ctx.quadraticCurveTo(18, 5, -18, 4);
    ctx.quadraticCurveTo(-22, 0, -18, -4);
    ctx.quadraticCurveTo(18, -5, 24, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff8e1';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.arc(i * 8, 0, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-6, -9); ctx.lineTo(-6, -20);
    ctx.moveTo(8, -9); ctx.lineTo(8, -20);
    ctx.stroke();
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath();
    ctx.ellipse(1, -22, 16, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(2, 0); ctx.lineTo(2, -24);
    ctx.stroke();
    ctx.fillStyle = '#fff8e1';
    ctx.beginPath();
    ctx.moveTo(2, -24);
    ctx.quadraticCurveTo(18, -18, 16, 0);
    ctx.quadraticCurveTo(8, -8, 2, -8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d84315';
    ctx.beginPath();
    ctx.arc(10, -12, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d84315';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(5, -20); ctx.lineTo(13, -16);
    ctx.moveTo(5, -16); ctx.lineTo(13, -8);
    ctx.stroke();

    for (let i = 0; i < state.cargo.length; i++) {
      ctx.save();
      ctx.translate(-12 + (i % 3) * 6, -2 + Math.floor(i / 3) * 4);
      ctx.scale(0.35, 0.35);
      itemTypes[state.cargo[i]].draw(ctx, 0, 0, 0);
      ctx.restore();
    }

    ctx.restore();
  }

  // Pet followers drawn following the boat
  function drawPets() {
    const offset = 36 + state.upgrades.hull.level * 4;
    let idx = 0;
    if (state.pets.dolphin) {
      const angle = boat.angle + Math.PI + (idx * 0.4 - 0.2);
      const x = boat.x + Math.cos(angle) * offset;
      const y = boat.y + Math.sin(angle) * offset;
      const psx = x - cam.x, psy = projY(y);
      drawShadow(psx, psy + 8, 16, 8);
      drawDolphin(psx, psy, boat.angle, performance.now() / 200);
      idx++;
    }
    if (state.pets.turtle) {
      const angle = boat.angle + Math.PI + (idx * 0.4 - 0.2);
      const x = boat.x + Math.cos(angle) * offset;
      const y = boat.y + Math.sin(angle) * offset;
      const psx = x - cam.x, psy = projY(y);
      drawShadow(psx, psy + 6, 14, 7);
      drawTurtle(psx, psy, boat.angle, performance.now() / 250);
      idx++;
    }
  }

  function drawDolphin(sx, sy, angle, t) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);
    const jump = Math.sin(t) * 4;
    ctx.translate(0, -jump);
    ctx.fillStyle = '#90a4ae';
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    // Belly
    ctx.fillStyle = '#eceff1';
    ctx.beginPath();
    ctx.ellipse(2, 2, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // Tail
    ctx.fillStyle = '#90a4ae';
    ctx.beginPath();
    ctx.moveTo(-16, 0);
    ctx.lineTo(-26, -7);
    ctx.lineTo(-22, 0);
    ctx.lineTo(-26, 7);
    ctx.closePath();
    ctx.fill();
    // Fin
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.lineTo(-4, -14);
    ctx.lineTo(4, -7);
    ctx.closePath();
    ctx.fill();
    // Eye
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(10, -1, 1.2, 0, Math.PI * 2); ctx.fill();
    // Smile
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(13, 1, 2, 0, Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  function drawTurtle(sx, sy, angle, t) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);
    // Shell
    ctx.fillStyle = '#558b2f';
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    // Shell pattern
    ctx.fillStyle = '#33691e';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 5, Math.sin(a) * 4, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // Head
    ctx.fillStyle = '#8bc34a';
    ctx.beginPath();
    ctx.arc(13, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    // Eye
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(15, -1, 0.9, 0, Math.PI * 2); ctx.fill();
    // Flippers
    const fl = Math.sin(t) * 2;
    ctx.fillStyle = '#8bc34a';
    ctx.beginPath();
    ctx.ellipse(-3, -10 + fl, 5, 3, 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-3, 10 - fl, 5, 3, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawNPCShips() {
    // Painter's order — closer to bottom of screen draws on top
    const sorted = npcShips.slice().sort((a, b) => a.y - b.y);
    for (const ship of sorted) {
      const sx = ship.x - cam.x, sy = projY(ship.y);
      if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;
      const bob = Math.sin(ship.bob) * 1.2;

      // Squashed shadow on the water
      ctx.save();
      ctx.translate(sx + 5, sy + 4);
      ctx.rotate(ship.angle);
      ctx.scale(1, TILT);
      ctx.fillStyle = 'rgba(0, 30, 60, 0.38)';
      ctx.beginPath();
      const sw = ship.type === 'voyager' ? 34 : 24;
      const sh = ship.type === 'voyager' ? 18 : 11;
      ctx.beginPath();
      ctx.ellipse(0, 0, sw, sh, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Ship body — full height, gently bobbing
      ctx.save();
      ctx.translate(sx, sy + bob);
      ctx.rotate(ship.angle);
      if (ship.type === 'voyager') drawVoyager(ship);
      else drawCanoe(ship);
      ctx.restore();

      // Greeting speech bubble
      if (ship.waveTimer > 0) {
        const fade = ship.waveTimer < 30 ? ship.waveTimer / 30 : 1;
        ctx.globalAlpha = fade;
        ctx.font = 'bold 14px Trebuchet MS';
        ctx.textAlign = 'center';
        const txt = ship.greeting;
        const tw = ctx.measureText(txt).width;
        const bx = sx, by = sy - 38;
        // Bubble
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#0277bd';
        ctx.lineWidth = 2;
        const bw = tw + 16, bh = 22;
        roundRect(bx - bw / 2, by - bh / 2, bw, bh, 8);
        ctx.fill();
        ctx.stroke();
        // Tail
        ctx.beginPath();
        ctx.moveTo(bx - 4, by + bh / 2 - 1);
        ctx.lineTo(bx, by + bh / 2 + 6);
        ctx.lineTo(bx + 4, by + bh / 2 - 1);
        ctx.closePath();
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#0277bd';
        ctx.stroke();
        // Text
        ctx.fillStyle = '#0277bd';
        ctx.fillText(txt, bx, by + 5);
        ctx.globalAlpha = 1;
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawCanoe(ship) {
    // Single-hull outrigger canoe (a bit smaller than player's)
    ctx.fillStyle = '#6d4c41';
    ctx.beginPath();
    ctx.moveTo(22, 0);
    ctx.quadraticCurveTo(17, 9, -17, 7);
    ctx.quadraticCurveTo(-24, 0, -17, -7);
    ctx.quadraticCurveTo(17, -9, 22, 0);
    ctx.closePath();
    ctx.fill();
    // Hull stripe in the ship's accent color
    ctx.fillStyle = ship.sailPattern;
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.quadraticCurveTo(13, 3.5, -13, 2.5);
    ctx.quadraticCurveTo(-16, 0, -13, -2.5);
    ctx.quadraticCurveTo(13, -3.5, 18, 0);
    ctx.closePath();
    ctx.fill();
    // Outrigger arms + float
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-4, -7); ctx.lineTo(-4, -16);
    ctx.moveTo(6, -7); ctx.lineTo(6, -16);
    ctx.stroke();
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath();
    ctx.ellipse(1, -18, 13, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Mast and sail
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(2, 0); ctx.lineTo(2, -22);
    ctx.stroke();
    ctx.fillStyle = ship.sailColor;
    ctx.beginPath();
    ctx.moveTo(2, -22);
    ctx.quadraticCurveTo(16, -17, 14, 0);
    ctx.quadraticCurveTo(7, -7, 2, -7);
    ctx.closePath();
    ctx.fill();
    // Sail pattern — sun dot + lines
    ctx.fillStyle = ship.sailPattern;
    ctx.beginPath();
    ctx.arc(9, -11, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = ship.sailPattern;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(4, -18); ctx.lineTo(11, -14);
    ctx.moveTo(4, -14); ctx.lineTo(11, -7);
    ctx.stroke();
    // Sailor dot
    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.arc(-2, 0, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffccbc';
    ctx.beginPath();
    ctx.arc(-2, -1.5, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawVoyager(ship) {
    // Double-hull voyaging canoe (wa'a kaulua) — larger, two parallel hulls
    // Hull A (top)
    ctx.fillStyle = '#5d4037';
    ctx.beginPath();
    ctx.moveTo(30, -9);
    ctx.quadraticCurveTo(24, -2, -22, -4);
    ctx.quadraticCurveTo(-30, -9, -22, -14);
    ctx.quadraticCurveTo(24, -16, 30, -9);
    ctx.closePath();
    ctx.fill();
    // Hull B (bottom)
    ctx.beginPath();
    ctx.moveTo(30, 9);
    ctx.quadraticCurveTo(24, 16, -22, 14);
    ctx.quadraticCurveTo(-30, 9, -22, 4);
    ctx.quadraticCurveTo(24, 2, 30, 9);
    ctx.closePath();
    ctx.fill();
    // Hull stripes
    ctx.fillStyle = ship.sailPattern;
    ctx.fillRect(-18, -12, 36, 2);
    ctx.fillRect(-18, 10, 36, 2);
    // Deck/platform connecting the hulls
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(-14, -8, 28, 16);
    // Deck planks
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 0.8;
    for (let i = -10; i <= 12; i += 4) {
      ctx.beginPath();
      ctx.moveTo(i, -8); ctx.lineTo(i, 8);
      ctx.stroke();
    }
    // Two masts
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.lineTo(-6, -30);
    ctx.moveTo(8, 0); ctx.lineTo(8, -30);
    ctx.stroke();
    // Sails — twin claw sails
    ctx.fillStyle = ship.sailColor;
    ctx.beginPath();
    ctx.moveTo(-6, -30);
    ctx.quadraticCurveTo(8, -24, 6, -2);
    ctx.quadraticCurveTo(0, -12, -6, -10);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8, -30);
    ctx.quadraticCurveTo(22, -24, 20, -2);
    ctx.quadraticCurveTo(14, -12, 8, -10);
    ctx.closePath();
    ctx.fill();
    // Sail sun motifs
    ctx.fillStyle = ship.sailPattern;
    ctx.beginPath();
    ctx.arc(2, -18, 3, 0, Math.PI * 2);
    ctx.arc(16, -18, 3, 0, Math.PI * 2);
    ctx.fill();
    // Crew figures
    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.arc(-8, 2, 2, 0, Math.PI * 2);
    ctx.arc(2, -4, 2, 0, Math.PI * 2);
    ctx.arc(10, 4, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffccbc';
    ctx.beginPath();
    ctx.arc(-8, 0.5, 1.3, 0, Math.PI * 2);
    ctx.arc(2, -5.5, 1.3, 0, Math.PI * 2);
    ctx.arc(10, 2.5, 1.3, 0, Math.PI * 2);
    ctx.fill();
  }

  // -------- Crusher the Crab boss --------
  function spawnBoss() {
    // Pick a spot far from islands and from the boat
    let x, y, tries = 0;
    do {
      x = rand(500, WORLD_W - 500);
      y = rand(500, WORLD_H - 500);
      tries++;
      let ok = true;
      for (const isl of islands) {
        if (Math.hypot(x - isl.x, y - isl.y) < 280) { ok = false; break; }
      }
      if (ok && Math.hypot(boat.x - x, boat.y - y) > 450) break;
    } while (tries < 40);

    boss.x = x; boss.y = y;
    boss.active = true;
    boss.circles = 0;
    boss.lastAngle = null;
    boss.cumulativeAngle = 0;
    boss.dizziness = 0;
    boss.defeatT = 0;
    boss.sinkY = 0;
    boss.bob = 0;
    boss.hinted = false;

    showToast('🦀 Crusher the Crab appears!');
    speak('A giant crab! Sail in circles around him!');
    sfx.unlock();
    shake(8, 22);
  }

  function defeatBoss() {
    // Drop a rare item right where boss was
    state.items.push({
      x: boss.x, y: boss.y,
      type: Math.random() < 0.5 ? 'treasure_chest' : 'golden_conch',
      bob: 0, rot: 0, rare: true,
    });
    // Big gold reward
    const bonus = 80;
    state.gold += bonus;
    state.bossesDefeated++;
    spawnCoinShower(bonus);
    spawnPopup(boss.x, boss.y, `+${bonus}g`, '#ffeb3b', true);
    spawnConfetti(boss.x, boss.y);
    shake(16, 32);
    cameraPunch();
    sfx.rare();
    speakGrandma('You did it! What a brave sailor!');
    showToast('🎉 Crab defeated!');
    checkAchievements();
    saveGame();
    boss.active = false;
    boss.spawnTimer = 60 * 90; // ~90s cooldown
  }

  function updateBoss() {
    if (!boss.active) {
      if (!state.started) return;
      boss.spawnTimer--;
      if (boss.spawnTimer <= 0) spawnBoss();
      return;
    }
    boss.bob += 0.06;
    boss.clawWave += 0.05;

    // Defeat animation
    if (boss.defeatT > 0) {
      boss.defeatT--;
      boss.sinkY += 0.8;
      if (boss.defeatT === 0) defeatBoss();
      return;
    }

    // Distance from boss to boat, decides if circling is being tracked
    const dx = boat.x - boss.x;
    const dy = boat.y - boss.y;
    const d = Math.hypot(dx, dy);
    if (d < 80 || d > 260) {
      boss.lastAngle = null; // reset — must be in the ring to count
      return;
    }
    // First-time approach hint
    if (!boss.hinted) {
      boss.hinted = true;
      setTimeout(() => speak('Sail around him!'), 400);
    }

    // Angle delta accumulation
    const angle = Math.atan2(dy, dx);
    if (boss.lastAngle === null) { boss.lastAngle = angle; return; }
    let delta = angle - boss.lastAngle;
    while (delta > Math.PI) delta -= Math.PI * 2;
    while (delta < -Math.PI) delta += Math.PI * 2;
    boss.cumulativeAngle += delta;
    boss.lastAngle = angle;

    // Completed a full lap
    if (Math.abs(boss.cumulativeAngle) >= Math.PI * 2) {
      boss.circles++;
      boss.cumulativeAngle = 0;
      boss.dizziness = Math.min(1, boss.circles / boss.target);
      sfx.unlock();
      shake(7, 16);
      spawnPopup(boss.x, boss.y - 40 / TILT, `Circle ${boss.circles}/${boss.target}!`, '#ffeb3b', true);
      cameraPunch();
      if (boss.circles >= boss.target) {
        // Begin defeat animation
        boss.defeatT = 60;
        speak('Whoa!');
      }
    }
  }

  function drawBossRing() {
    // Faint dashed ring showing the circling zone — helps the kid know where to sail
    if (!boss.active || boss.defeatT > 0) return;
    const sx = boss.x - cam.x;
    const sy = projY(boss.y);
    const r = 170;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 235, 130, 0.55)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    const phase = (performance.now() / 60) % 18;
    ctx.lineDashOffset = -phase;
    ctx.beginPath();
    ctx.ellipse(sx, sy, r, r * TILT, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawBoss() {
    if (!boss.active) return;
    const sx = boss.x - cam.x;
    const sy = projY(boss.y) + boss.sinkY;
    if (sx < -250 || sx > W + 250 || sy < -250 || sy > H + 250) return;

    const bob = Math.sin(boss.bob) * 3;
    const dizzy = boss.defeatT > 0 ? 1 : boss.dizziness;
    const spinW = boss.defeatT > 0 ? performance.now() / 80 : Math.sin(performance.now() / 220) * dizzy * 0.18;
    const sinkAlpha = boss.defeatT > 0 ? Math.max(0.3, 1 - boss.sinkY / 80) : 1;

    // Big squashed shadow
    ctx.save();
    ctx.globalAlpha = sinkAlpha * 0.55;
    ctx.fillStyle = '#001f3f';
    ctx.beginPath();
    ctx.ellipse(sx + 10, sy + 14, 78, 24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = sinkAlpha;
    ctx.translate(sx, sy + bob);
    ctx.rotate(spinW);

    // Legs (animated walking)
    ctx.strokeStyle = '#b71c1c';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    const legWave = Math.sin(boss.bob * 2) * 5;
    for (let i = 0; i < 6; i++) {
      const side = i < 3 ? -1 : 1;
      const idx = i % 3;
      const offY = (-1 + idx) * 12;
      const lift = Math.sin(boss.bob * 2 + idx) * 4;
      ctx.beginPath();
      ctx.moveTo(side * 30, offY);
      ctx.quadraticCurveTo(side * 45, offY + lift, side * 56, offY + 10 + legWave * 0.3);
      ctx.stroke();
    }

    // Body
    const bodyGrad = ctx.createRadialGradient(-10, -10, 8, 0, 0, 52);
    bodyGrad.addColorStop(0, '#ff6659');
    bodyGrad.addColorStop(0.7, '#e53935');
    bodyGrad.addColorStop(1, '#b71c1c');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 50, 40, 0, 0, Math.PI * 2);
    ctx.fill();
    // Body spots
    ctx.fillStyle = '#b71c1c';
    [[16, 6, 5], [-18, -3, 4], [0, 14, 4], [-8, -12, 3], [12, -10, 3]].forEach(([px, py, pr]) => {
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    });
    // Highlight
    const hl = ctx.createRadialGradient(-15, -15, 2, -15, -15, 30);
    hl.addColorStop(0, 'rgba(255,255,255,0.5)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.beginPath();
    ctx.ellipse(0, 0, 50, 40, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eye stalks (pupils track the boat unless dizzy)
    let eyeAngle = 0;
    if (boss.defeatT === 0) {
      eyeAngle = Math.atan2(boat.y - boss.y, boat.x - boss.x);
    } else {
      eyeAngle = performance.now() / 150;
    }
    [[-12, -22], [12, -22]].forEach(([ex, ey]) => {
      ctx.strokeStyle = '#b71c1c';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ex * 0.6, -16);
      ctx.lineTo(ex, ey - 12);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ex, ey - 12, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(ex + Math.cos(eyeAngle) * 1.8, ey - 12 + Math.sin(eyeAngle) * 1.8, 2.6, 0, Math.PI * 2);
      ctx.fill();
    });

    // Big mouth smile
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 4, 8, 0.15, Math.PI - 0.15);
    ctx.stroke();
    // Teeth
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-3, 11); ctx.lineTo(0, 13); ctx.lineTo(3, 11); ctx.closePath();
    ctx.fill();

    // Dizzy stars
    if (dizzy > 0.1) {
      const t = performance.now() / 220;
      for (let i = 0; i < 4; i++) {
        const a = t + (i / 4) * Math.PI * 2;
        const sx2 = Math.cos(a) * 24;
        const sy2 = Math.sin(a) * 6 - 42;
        ctx.font = 'bold 18px Trebuchet MS';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffeb3b';
        ctx.strokeStyle = '#3e2723';
        ctx.lineWidth = 3;
        ctx.strokeText('⭐', sx2, sy2);
        ctx.fillText('⭐', sx2, sy2);
      }
    }

    // Left claw
    const clawWave = Math.sin(boss.clawWave) * 5;
    ctx.save();
    ctx.translate(-45, -8);
    ctx.rotate(-0.5 + clawWave * 0.04);
    // Arm segment
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    // Pincer (two halves)
    ctx.translate(-16, 0);
    ctx.fillStyle = '#c62828';
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.quadraticCurveTo(-15, -4, -14, 4);
    ctx.lineTo(-5, 1); ctx.lineTo(-3, -4); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.quadraticCurveTo(-15, 4, -14, -4);
    ctx.lineTo(-5, -1); ctx.lineTo(-3, 4); ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Right claw (mirror)
    ctx.save();
    ctx.translate(45, -8);
    ctx.rotate(0.5 - clawWave * 0.04);
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.translate(16, 0);
    ctx.fillStyle = '#c62828';
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.quadraticCurveTo(15, -4, 14, 4);
    ctx.lineTo(5, 1); ctx.lineTo(3, -4); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.quadraticCurveTo(15, 4, 14, -4);
    ctx.lineTo(5, -1); ctx.lineTo(3, 4); ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Treasure chest held above (only while alive)
    if (boss.defeatT === 0) {
      ctx.save();
      ctx.translate(0, -28 + Math.sin(boss.clawWave) * 1.5);
      const tg = ctx.createRadialGradient(0, 0, 4, 0, 0, 26);
      tg.addColorStop(0, 'rgba(255,235,130,0.6)');
      tg.addColorStop(1, 'rgba(255,235,130,0)');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
      drawTreasureChest(ctx, 0, 0, 0);
      ctx.restore();
    }

    ctx.restore();

    // Progress stars above the boss
    if (boss.defeatT === 0) {
      ctx.save();
      ctx.font = 'bold 24px Trebuchet MS';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#3e2723';
      for (let i = 0; i < boss.target; i++) {
        const x = sx + (i - (boss.target - 1) / 2) * 26;
        const y = sy - 70;
        const got = i < boss.circles;
        ctx.fillStyle = got ? '#ffeb3b' : 'rgba(255,255,255,0.45)';
        ctx.strokeText('★', x, y);
        ctx.fillText('★', x, y);
      }
      ctx.restore();
    }
  }

  // Off-screen indicator that points toward the boss
  function drawBossArrow() {
    if (!boss.active || boss.defeatT > 0) return;
    const sx = boss.x - cam.x, sy = projY(boss.y);
    if (sx > 60 && sx < W - 60 && sy > 60 && sy < H - 60) return;
    const a = Math.atan2(boss.y - boat.y, boss.x - boat.x);
    const cx = W / 2, cy = H / 2;
    const padX = W / 2 - 60;
    const padY = H / 2 - 60;
    const k = Math.min(padX / Math.abs(Math.cos(a) || 0.0001), padY / Math.abs(Math.sin(a) || 0.0001));
    const px = cx + Math.cos(a) * k;
    const py = cy + Math.sin(a) * k;

    const pulse = 1 + Math.sin(performance.now() / 220) * 0.08;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = 'rgba(229, 57, 53, 0.85)';
    ctx.strokeStyle = '#ffe082';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.font = 'bold 26px Trebuchet MS';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText('🦀', 0, 1);
    // Arrow blip
    ctx.save();
    ctx.rotate(a);
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.moveTo(36, 0); ctx.lineTo(28, -7); ctx.lineTo(28, 7); ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function drawWildCreatures() {
    // Sort by world Y for proper depth painter's algorithm
    const sorted = state.wildCreatures.slice().sort((a, b) => a.y - b.y);
    for (const c of sorted) {
      const sx = c.x - cam.x;
      const bob = Math.sin(c.bob) * 2;
      const sy = projY(c.y) + bob;
      if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
      // Shadow that shrinks when creature rises
      const liftFactor = 1 - (bob + 2) / 8;
      ctx.fillStyle = `rgba(0, 30, 60, ${0.3 * liftFactor})`;
      ctx.beginPath();
      ctx.ellipse(sx + 4, sy + 12, 16 * liftFactor, 5 * liftFactor * TILT * 1.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      // Highlight when near
      if (c === state.nearWild) {
        ctx.fillStyle = 'rgba(255,235,130,0.4)';
        ctx.beginPath();
        ctx.arc(sx, sy, 28 + Math.sin(performance.now() / 200) * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      const angle = Math.atan2(c.vy, c.vx);
      if (c.kind === 'dolphin') {
        drawDolphin(sx, sy, angle, c.bob * 2);
      } else {
        drawTurtle(sx, sy, angle, c.bob * 2);
      }
      ctx.restore();
    }
  }

  function drawItems() {
    // Painter's order so items closer to bottom of screen draw on top
    const sorted = state.items.slice().sort((a, b) => a.y - b.y);
    for (const it of sorted) {
      const sx = it.x - cam.x;
      const bob = Math.sin(it.bob) * 3;
      const sy = projY(it.y) + bob;
      if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
      // Squashed shadow on water (stays at base position, doesn't bob)
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(sx, projY(it.y) + 10, 10, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Rare items get a glow
      if (itemTypes[it.type].rare) {
        const gl = ctx.createRadialGradient(sx, sy, 4, sx, sy, 32);
        gl.addColorStop(0, 'rgba(255,235,130,0.6)');
        gl.addColorStop(1, 'rgba(255,235,130,0)');
        ctx.fillStyle = gl;
        ctx.beginPath();
        ctx.arc(sx, sy, 32, 0, Math.PI * 2);
        ctx.fill();
      }
      itemTypes[it.type].draw(ctx, sx, sy, it.rot);
    }
  }

  function drawShell(ctx, x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = '#f8bbd0';
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.quadraticCurveTo(-12, 6, -10, -6);
    ctx.quadraticCurveTo(0, -14, 10, -6);
    ctx.quadraticCurveTo(12, 6, 0, 8);
    ctx.fill();
    ctx.strokeStyle = '#ad1457';
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 7);
      ctx.lineTo(i * 4, -8);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawStarfish(ctx, x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = '#ff7043';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      const r = i % 2 === 0 ? 12 : 5;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff3e0';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 5, Math.sin(a) * 5, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawPearl(ctx, x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#90a4ae';
    ctx.beginPath();
    ctx.ellipse(0, 5, 12, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#cfd8dc';
    ctx.beginPath();
    ctx.ellipse(0, -1, 11, 5, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 5);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#e1bee7');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 1, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawCoral(ctx, x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot * 0.2);
    ctx.fillStyle = '#ec407a';
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.lineTo(-3, -4); ctx.lineTo(-8, -6); ctx.lineTo(-3, -2);
    ctx.lineTo(-2, -10); ctx.lineTo(0, -4); ctx.lineTo(2, -10);
    ctx.lineTo(3, -2); ctx.lineTo(8, -6); ctx.lineTo(3, -4);
    ctx.lineTo(2, 10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f48fb1';
    ctx.beginPath();
    ctx.arc(-2, -7, 1.5, 0, Math.PI * 2);
    ctx.arc(2, -7, 1.5, 0, Math.PI * 2);
    ctx.arc(0, -3, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawGoldenConch(ctx, x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    // Pulsing glow
    const pulse = Math.sin(performance.now() / 250) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,235,130,${0.5 * pulse})`;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    // Conch body
    const g = ctx.createLinearGradient(-10, -10, 10, 10);
    g.addColorStop(0, '#fff59d');
    g.addColorStop(1, '#ff8f00');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-12, 6);
    ctx.quadraticCurveTo(-14, -10, 0, -12);
    ctx.quadraticCurveTo(14, -8, 10, 8);
    ctx.quadraticCurveTo(0, 12, -12, 6);
    ctx.fill();
    // Spiral
    ctx.strokeStyle = '#bf360c';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(2, -2, 6, 0, Math.PI * 1.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(2, -2, 3, 0, Math.PI * 1.5);
    ctx.stroke();
    // Highlight
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-5, -5, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function drawTreasureChest(ctx, x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    const pulse = Math.sin(performance.now() / 200) * 0.4 + 0.6;
    ctx.fillStyle = `rgba(255,235,130,${0.6 * pulse})`;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    // Chest box
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(-12, -2, 24, 14);
    // Lid
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath();
    ctx.moveTo(-12, -2);
    ctx.quadraticCurveTo(0, -14, 12, -2);
    ctx.closePath();
    ctx.fill();
    // Bands
    ctx.fillStyle = '#ffc107';
    ctx.fillRect(-12, -2, 24, 2);
    ctx.fillRect(-12, 5, 24, 2);
    // Lock
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(-2, -1, 4, 5);
    // Gold sparkles peeking
    ctx.fillStyle = '#fff176';
    ctx.beginPath();
    ctx.arc(-4, -4, 2, 0, Math.PI * 2);
    ctx.arc(3, -6, 1.5, 0, Math.PI * 2);
    ctx.arc(5, -3, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawClouds() {
    for (const c of state.clouds) {
      // Clouds float in sky — projected with reduced parallax and
      // lifted upward to feel airborne above the tilted water.
      const sx = c.x - cam.x * 0.6;
      const sy = projY(c.y) - 60;
      if (sx < -100 || sx > W + 100) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(sx, sy, c.r * 0.6, 0, Math.PI * 2);
      ctx.arc(sx + c.r * 0.5, sy + 4, c.r * 0.5, 0, Math.PI * 2);
      ctx.arc(sx - c.r * 0.5, sy + 4, c.r * 0.5, 0, Math.PI * 2);
      ctx.arc(sx + c.r * 0.2, sy - c.r * 0.3, c.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  function drawFishes() {
    for (const f of state.fishes) {
      const sx = f.x - cam.x;
      const sy = projY(f.y) + Math.sin(f.bob) * 3;
      if (sx < -30 || sx > W + 30) continue;
      ctx.save();
      ctx.translate(sx, sy);
      if (f.vx < 0) ctx.scale(-1, 1);
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-7, 0); ctx.lineTo(-12, -4); ctx.lineTo(-12, 4); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(5, -1, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(5.4, -1, 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawSparkles() {
    for (const s of state.sparkles) {
      const sx = s.x - cam.x, sy = projY(s.y);
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(sx, sy, 3 * s.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Pulsing ring on the next thing the player should aim for.
  // Smart targeting: follows the active quest when possible.
  function drawWaypoint() {
    if (!state.started || state.shopOpen || state.miniGameOpen) return;
    let target = null;
    const q = currentQuest();
    const cargoFullish = state.cargo.length >= cargoMax() * 0.8 && state.cargo.length > 0;

    // Active boss takes top priority
    if (boss.active && boss.defeatT === 0) {
      target = { x: boss.x, y: boss.y };
    }
    // Cargo nearly full overrides — go sell first
    else if (cargoFullish) {
      let bestD = Infinity;
      for (const isl of islands) {
        if (!isl.unlocked) continue;
        const d = Math.hypot(boat.x - isl.x, boat.y - isl.y);
        if (d < bestD) { bestD = d; target = isl; }
      }
    }
    // Quest "collect specific item"
    else if (q && q.track.type === 'collect' && q.track.what) {
      let bestD = Infinity;
      for (const it of state.items) {
        if (it.type !== q.track.what) continue;
        const d = dist2(boat, it);
        if (d < bestD) { bestD = d; target = it; }
      }
    }
    // Quest "visit island"
    else if (q && q.track.type === 'visit') {
      const isl = islandById(q.track.what);
      if (isl && isl.unlocked) target = isl;
    }
    // Quest "sell" or "upgrade" → head home
    else if (q && (q.track.type === 'sell' || q.track.type === 'upgrade')) {
      target = islandById('home');
    }
    // Quest "befriend" → point at nearest wild creature
    else if (q && (q.track.type === 'befriend' || q.track.type === 'both_pets')) {
      let bestD = Infinity;
      for (const c of state.wildCreatures) {
        if (state.pets[c.kind]) continue;
        const d = dist2(boat, c);
        if (d < bestD) { bestD = d; target = c; }
      }
    }
    // Quest "collect_rare" → point at rare item if any visible
    else if (q && q.track.type === 'collect_rare') {
      let bestD = Infinity;
      for (const it of state.items) {
        if (!itemTypes[it.type].rare) continue;
        const d = dist2(boat, it);
        if (d < bestD) { bestD = d; target = it; }
      }
    }

    // Fallback: any normal item nearby
    if (!target) {
      let bestD = Infinity;
      for (const it of state.items) {
        if (itemTypes[it.type].rare) continue;
        const d = dist2(boat, it);
        if (d < bestD) { bestD = d; target = it; }
      }
    }
    if (!target) return;
    const sx = target.x - cam.x, sy = projY(target.y);
    const t = performance.now() / 280;
    const pulse = (Math.sin(t) + 1) / 2;
    ctx.save();
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      const off = (t * 0.5 + i / 3) % 1;
      const r = 24 + off * 28;
      ctx.strokeStyle = `rgba(255, 235, 130, ${0.65 * (1 - off)})`;
      ctx.beginPath();
      ctx.ellipse(sx, sy, r, r * 0.65, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Tutorial: big bouncing arrow pointing from the boat toward the next goal
  function drawTutorial() {
    if (!state.tutorial.active) return;
    let target = null;
    let phrase = '';
    if (state.tutorial.step === 0) {
      let bestD = Infinity;
      for (const it of state.items) {
        if (itemTypes[it.type].rare) continue;
        const d = dist2(boat, it);
        if (d < bestD) { bestD = d; target = it; }
      }
      phrase = 'collect!';
    } else if (state.tutorial.step === 1) {
      target = islandById('home');
      phrase = 'home!';
    }
    if (!target) return;
    const sx = boat.x - cam.x, sy = projY(boat.y);
    const dx = target.x - boat.x, dy = target.y - boat.y;
    const ang = Math.atan2(dy, dx);
    const bob = (Math.sin(performance.now() / 250) + 1) * 6;
    const r = 90 + bob;
    const ax = sx + Math.cos(ang) * r;
    const ay = sy + Math.sin(ang) * r * TILT;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(ang);
    ctx.fillStyle = '#ffeb3b';
    ctx.strokeStyle = '#e65100';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(28, 0);
    ctx.lineTo(-8, -20);
    ctx.lineTo(0, 0);
    ctx.lineTo(-8, 20);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 3;
    ctx.font = 'bold 18px Trebuchet MS';
    ctx.textAlign = 'center';
    const txt = phrase;
    ctx.strokeText(txt, sx, sy - 70);
    ctx.fillText(txt, sx, sy - 70);
  }

  function drawCompass() {
    // Point toward nearest unlocked island we're not already at
    let target = null, bestD = Infinity;
    for (const isl of islands) {
      if (!isl.unlocked) continue;
      if (isl === state.nearIsland) continue;
      const d = Math.hypot(boat.x - isl.x, boat.y - isl.y);
      if (d < bestD) { bestD = d; target = isl; }
    }
    if (!target || bestD < 350) {
      // Always show home when we're away from it
      target = home;
      const d = Math.hypot(boat.x - home.x, boat.y - home.y);
      if (d < 350) return;
    }
    const dx = target.x - boat.x;
    const dy = target.y - boat.y;
    const a = Math.atan2(dy, dx);
    const cx = W / 2, cy = H - 80;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(0, 60, 90, 0.55)';
    ctx.strokeStyle = '#ffe082';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.rotate(a);
    ctx.fillStyle = '#ffe082';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(0, -7);
    ctx.lineTo(4, 0);
    ctx.lineTo(0, 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ffe082';
    ctx.font = 'bold 11px Trebuchet MS';
    ctx.textAlign = 'center';
    ctx.fillText(target.name.toLowerCase(), cx, cy + 40);
  }

  // -------- HUD --------

  // -------- Shop --------

  function openShop(isl) {

  function closeShop() {
    state.shopOpen = false;
    shopEl.style.display = 'none';
    if (state.nearIsland) {
      const isl = state.nearIsland;
      const dx = boat.x - isl.x, dy = boat.y - isl.y;
      const d = Math.hypot(dx, dy) || 1;
      boat.x = isl.x + (dx / d) * (isl.r + 45);
      boat.y = isl.y + (dy / d) * (isl.r + 45);
      boat.vx = (dx / d) * 1.5;
      boat.vy = (dy / d) * 1.5;
      state.nearIsland = null;
    }
  }
  function renderUpgrades() {
    upgradesEl.innerHTML = '';
    for (const [key, u] of Object.entries(state.upgrades)) {
      const cost = upgradeCost(key);
      const canAfford = state.gold >= cost;
      const div = document.createElement('div');
      div.className = 'upgrade';
      div.innerHTML = `
        <div class="upgrade-row">
          <div>
            <div class="upgrade-name">${u.name}</div>
            <div class="upgrade-level">Level ${u.level} — ${u.desc}</div>
          </div>
          <button ${canAfford ? '' : 'disabled'} data-key="${key}">${cost} gold</button>
        </div>
      `;
      upgradesEl.appendChild(div);
    }
    upgradesEl.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        const key = b.dataset.key;
        const cost = upgradeCost(key);
        if (state.gold >= cost) {
          state.gold -= cost;
          state.upgrades[key].level++;
          sfx.upgrade();
          showMsg(`Upgraded ${state.upgrades[key].name}!`);
          speak('Yay!');
          cameraPunch();

            handleQuestEvent('upgrade', key);

  // Coconut Catch

  function newFishingRound() {
    if (!mgState) return;
    mgState.pos = 0;
    mgState.vel = 0.014 + mgState.round * 0.003;
    mgState.zoneWidth = Math.max(0.10, 0.22 - mgState.round * 0.02);
    mgState.zoneStart = rand(0.25, 0.75 - mgState.zoneWidth);
    mgState.locked = false;
    mgState.lastResult = null;
  }

  // Mini-game input
  mgCanvas.addEventListener('mousemove', (e) => {
    if (mgState && mgState.kind === 'coconut') {
      const rect = mgCanvas.getBoundingClientRect();
      mgState.basketX = (e.clientX - rect.left) * (mgCanvas.width / rect.width);
    }
  });
  mgCanvas.addEventListener('pointerdown', (e) => {
    if (mgState && mgState.kind === 'fishing' && !mgState.locked) {
      lockFishing();
    }
  });
  window.addEventListener('keydown', (e) => {
    if (!mgState) return;
    if (mgState.kind === 'fishing' && e.key === ' ' && !mgState.locked) {
      e.preventDefault();
      lockFishing();
    }
  });

  function lockFishing() {
    const s = mgState;
    if (s.pos >= s.zoneStart && s.pos <= s.zoneStart + s.zoneWidth) {
      // Hit — closer to center = more
      const center = s.zoneStart + s.zoneWidth / 2;
      const off = Math.abs(s.pos - center) / (s.zoneWidth / 2);
      const fishGold = Math.round(15 - off * 8);
      s.score += fishGold;
      s.earned += fishGold;
      s.lastResult = { ok: true, gold: fishGold };
    } else {
      s.lastResult = { ok: false, gold: 0 };
    }
    s.locked = true;
    setTimeout(() => {
      if (!mgState) return;
      mgState.round++;
      if (mgState.round >= mgState.maxRounds) {
        showMsg(`Fishing done! +${mgState.earned} gold`);
        closeMiniGame();
      } else {
        newFishingRound();
      }
    }, 900);
  }

  function updateMiniGame() {
    if (!mgState) return;
    if (mgState.kind === 'coconut') {
      const s = mgState;
      const now = performance.now();
      s.time = Math.max(0, 30 - Math.floor((now - s.started) / 1000));
      mgTimeEl.textContent = s.time;
      if (s.time <= 0) {
        showMsg(`Coconut Catch done! +${s.earned} gold`);
        closeMiniGame();
        return;
      }
      // Spawn
      s.spawnT--;
      if (s.spawnT <= 0) {
        const isBomb = Math.random() < 0.18;
        const isGold = !isBomb && Math.random() < 0.10;
        s.coconuts.push({
          x: rand(20, mgCanvas.width - 20),
          y: -20,
          vy: rand(3, 5),
          type: isBomb ? 'bomb' : (isGold ? 'gold' : 'normal'),
        });
        s.spawnT = Math.floor(rand(22, 50));
      }
      // Update coconuts
      const basketY = mgCanvas.height - 30;
      for (let i = s.coconuts.length - 1; i >= 0; i--) {
        const c = s.coconuts[i];
        c.y += c.vy;
        // Catch?
        if (c.y > basketY - 10 && c.y < basketY + 18 && Math.abs(c.x - s.basketX) < 28) {
          if (c.type === 'bomb') {
            s.earned = Math.max(0, s.earned - 5);
            showFloatScore(c.x, basketY - 10, '-5', '#e53935');
          } else if (c.type === 'gold') {
            s.earned += 15;
            s.score += 15;
            showFloatScore(c.x, basketY - 10, '+15', '#ffc107');
          } else {
            s.earned += 3;
            s.score += 3;
            showFloatScore(c.x, basketY - 10, '+3', '#fff');
          }
          s.coconuts.splice(i, 1);
          continue;
        }
        if (c.y > mgCanvas.height + 20) s.coconuts.splice(i, 1);
      }
      mgScoreEl.textContent = s.earned;
      // Keyboard movement
      if (keys['arrowleft'] || keys['a']) s.basketX -= 5;
      if (keys['arrowright'] || keys['d']) s.basketX += 5;
      s.basketX = clamp(s.basketX, 30, mgCanvas.width - 30);
    } else if (mgState.kind === 'fishing') {
      const s = mgState;
      if (!s.locked) {
        s.pos += s.vel;
        if (s.pos > 1) { s.pos = 1; s.vel = -Math.abs(s.vel); }
        if (s.pos < 0) { s.pos = 0; s.vel = Math.abs(s.vel); }
      }
      mgScoreEl.textContent = s.earned;
      mgTimeEl.textContent = `${s.round}/${s.maxRounds}`;
    }
    drawMiniGame();
  }

  const floatScores = [];
  function showFloatScore(x, y, text, color) {
    floatScores.push({ x, y, text, color, life: 1 });
  }

  function drawMiniGame() {
    const c = mgCtx;
    c.clearRect(0, 0, mgCanvas.width, mgCanvas.height);
    if (!mgState) return;
    if (mgState.kind === 'coconut') {
      // Sky
      const g = c.createLinearGradient(0, 0, 0, mgCanvas.height);
      g.addColorStop(0, '#81d4fa');
      g.addColorStop(1, '#fff59d');
      c.fillStyle = g;
      c.fillRect(0, 0, mgCanvas.width, mgCanvas.height);
      // Ground
      c.fillStyle = '#fff59d';
      c.fillRect(0, mgCanvas.height - 20, mgCanvas.width, 20);
      // Palm trees at top
      for (let i = 0; i < 3; i++) {
        const x = 80 + i * 180;
        c.fillStyle = '#6d4c41';
        c.fillRect(x - 4, 0, 8, 50);
        c.fillStyle = '#43a047';
        for (let j = 0; j < 5; j++) {
          const a = (j / 5) * Math.PI * 2;
          c.save();
          c.translate(x, 50);
          c.rotate(a);
          c.beginPath();
          c.ellipse(15, 0, 18, 6, 0, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }
      }
      // Coconuts
      for (const co of mgState.coconuts) {
        if (co.type === 'bomb') {
          c.fillStyle = '#212121';
          c.beginPath();
          c.arc(co.x, co.y, 10, 0, Math.PI * 2);
          c.fill();
          c.strokeStyle = '#ff6f00';
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(co.x, co.y - 10);
          c.lineTo(co.x + 4, co.y - 16);
          c.stroke();
          c.fillStyle = '#ffeb3b';
          c.beginPath();
          c.arc(co.x + 4, co.y - 16, 2, 0, Math.PI * 2);
          c.fill();
        } else if (co.type === 'gold') {
          const grad = c.createRadialGradient(co.x - 3, co.y - 3, 2, co.x, co.y, 12);
          grad.addColorStop(0, '#fff59d');
          grad.addColorStop(1, '#ff8f00');
          c.fillStyle = grad;
          c.beginPath();
          c.arc(co.x, co.y, 12, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = '#fff';
          c.beginPath();
          c.arc(co.x - 4, co.y - 4, 2, 0, Math.PI * 2);
          c.fill();
        } else {
          c.fillStyle = '#5d4037';
          c.beginPath();
          c.arc(co.x, co.y, 10, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = '#3e2723';
          c.beginPath();
          c.arc(co.x - 3, co.y - 1, 1.5, 0, Math.PI * 2);
          c.arc(co.x + 3, co.y - 1, 1.5, 0, Math.PI * 2);
          c.arc(co.x, co.y + 3, 1.5, 0, Math.PI * 2);
          c.fill();
        }
      }
      // Basket
      const bx = mgState.basketX, by = mgCanvas.height - 30;
      c.fillStyle = '#8d6e63';
      c.beginPath();
      c.moveTo(bx - 30, by);
      c.lineTo(bx + 30, by);
      c.lineTo(bx + 22, by + 18);
      c.lineTo(bx - 22, by + 18);
      c.closePath();
      c.fill();
      c.strokeStyle = '#3e2723';
      c.lineWidth = 1.5;
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        c.moveTo(bx + i * 10, by);
        c.lineTo(bx + i * 8, by + 18);
        c.stroke();
      }
      // Float scores
      for (let i = floatScores.length - 1; i >= 0; i--) {
        const f = floatScores[i];
        c.globalAlpha = f.life;
        c.fillStyle = f.color;
        c.font = 'bold 18px Trebuchet MS';
        c.textAlign = 'center';
        c.fillText(f.text, f.x, f.y);
        f.y -= 1.5;
        f.life -= 0.025;
        if (f.life <= 0) floatScores.splice(i, 1);
      }
      c.globalAlpha = 1;
    } else if (mgState.kind === 'fishing') {
      // Background — water
      const g = c.createLinearGradient(0, 0, 0, mgCanvas.height);
      g.addColorStop(0, '#4fc3f7');
      g.addColorStop(1, '#0277bd');
      c.fillStyle = g;
      c.fillRect(0, 0, mgCanvas.width, mgCanvas.height);
      // Dock
      c.fillStyle = '#6d4c41';
      c.fillRect(0, 200, mgCanvas.width, 12);
      // Figure with rod
      c.fillStyle = '#3e2723';
      c.fillRect(50, 160, 10, 40);
      c.fillStyle = '#ffccbc';
      c.beginPath();
      c.arc(55, 155, 8, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = '#5d4037';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(60, 170);
      c.lineTo(180, 100);
      c.stroke();
      // Line down
      c.strokeStyle = '#fff';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(180, 100);
      c.lineTo(200, 240);
      c.stroke();
      // Fish under water
      for (let i = 0; i < 4; i++) {
        const fy = 230 + i * 18;
        const fx = 200 + Math.sin(performance.now() / 500 + i) * 20;
        c.fillStyle = ['#ff7043','#ffd54f','#4dd0e1','#ba68c8'][i];
        c.beginPath();
        c.ellipse(fx, fy, 8, 4, 0, 0, Math.PI * 2);
        c.fill();
        c.beginPath();
        c.moveTo(fx - 7, fy); c.lineTo(fx - 12, fy - 3); c.lineTo(fx - 12, fy + 3); c.closePath();
        c.fill();
      }

      // Casting bar
      const barX = 60, barY = 60, barW = mgCanvas.width - 120, barH = 24;
      c.fillStyle = 'rgba(0,0,0,0.4)';
      c.fillRect(barX, barY, barW, barH);
      // Green zone
      const s = mgState;
      c.fillStyle = '#4caf50';
      c.fillRect(barX + s.zoneStart * barW, barY, s.zoneWidth * barW, barH);
      // Bullseye stripe in middle
      c.fillStyle = '#ffeb3b';
      const center = s.zoneStart + s.zoneWidth / 2;
      c.fillRect(barX + center * barW - 2, barY, 4, barH);
      // Border
      c.strokeStyle = '#ffe082';
      c.lineWidth = 2;
      c.strokeRect(barX, barY, barW, barH);
      // Marker
      const mx = barX + s.pos * barW;
      c.fillStyle = '#fff';
      c.beginPath();
      c.moveTo(mx, barY - 6);
      c.lineTo(mx - 6, barY - 14);
      c.lineTo(mx + 6, barY - 14);
      c.closePath();
      c.fill();
      c.fillRect(mx - 1, barY - 4, 2, barH + 8);

      // Result
      if (s.lastResult) {
        c.font = 'bold 28px Trebuchet MS';
        c.textAlign = 'center';
        c.fillStyle = s.lastResult.ok ? '#4caf50' : '#e53935';
        c.fillText(s.lastResult.ok ? `Caught! +${s.lastResult.gold}g` : 'Missed!', mgCanvas.width / 2, 140);
      } else {
        c.font = 'bold 16px Trebuchet MS';
        c.textAlign = 'center';
        c.fillStyle = '#fff';
        c.fillText(`Round ${s.round + 1} of ${s.maxRounds} — click in the green!`, mgCanvas.width / 2, 140);
      }
    }
  }

  function speakGrandma(text) {
    // Slightly different voice (lower pitch + slower) for the elder
    if (sfx.muted) return;
    if (!('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.pitch = 1.15;
      u.volume = 0.85;
      const voices = speechSynthesis.getVoices();
      const pref = voices.find(v =>
        /female|samantha|karen|tessa|moira|google us english|en-us/i.test(v.name + ' ' + v.lang)
      );
      if (pref) u.voice = pref;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      lastSpeakAt = performance.now();
    } catch {}
  }

  function updateQuestWidget() {
    const q = currentQuest();
    if (!q || state.tutorial.active) {
      questWidget.classList.remove('visible');
      return;

    questWidget.classList.add('visible');
    questPortrait.textContent = q.icon;
    questTitle.textContent = q.title;
    if (q.target > 1) {
      // Render dots showing progress

      for (let i = 0; i < Math.min(q.target, 8); i++) {
        dots += `<span class="qdot${i < state.questProgress ? ' done' : ''}"></span>`;
      }
      dots += '</span>';
      questProgressEl.innerHTML = `${state.questProgress}/${q.target}${dots}`;
    } else {
      questProgressEl.textContent = '(tap Grandma for help)';
    }
  }

  function spawnConfetti(x, y) {
    const colors = ['#ff5252', '#ffeb3b', '#4caf50', '#2196f3', '#9c27b0', '#ff9800', '#fff', '#e91e63'];
    for (let i = 0; i < 60; i++) {
      state.sparkles.push({
        x, y,
        vx: rand(-4.5, 4.5),
        vy: rand(-7, -1.5),
        life: 1.6,
        color: colors[Math.floor(Math.random() * colors.length)],
      });
