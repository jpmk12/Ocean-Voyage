  function completeQuest() {
    const q = currentQuest();
    if (!q) return;
    state.gold += q.reward;
    sfx.upgrade();
    showToast(`Quest done! +${q.reward}g`);
    speakGrandma(q.done);
    spawnConfetti(boat.x, boat.y);
    spawnPopup(boat.x, boat.y, `+${q.reward}g`, '#ffeb3b', true);
    cameraPunch();
    shake(8, 20);
    spawnCoinShower(q.reward);
    questWidget.classList.add('celebrating');
    setTimeout(() => questWidget.classList.remove('celebrating'), 1300);
    state.questIndex++;
    state.questProgress = 0;
    saveGame();
    updateQuestWidget();
    checkAchievements();
    // After the celebration, announce next quest
    setTimeout(() => {
      const next = currentQuest();
      if (next) {
        popQuestWidget();
        showToast(`New quest: ${next.title}`);
        setTimeout(() => speakGrandma(next.prompt), 600);
      } else {
        showToast('You finished all quests!');
      }
    }, 1800);
  }

  function handleQuestEvent(type, what) {
    if (state.tutorial.active) return;
    const q = currentQuest();
    if (!q) return;
    const t = q.track;

    // Special: 'both_pets' — completes when both flags true
    if (t.type === 'both_pets') {
      if (type === 'befriend' && state.pets.dolphin && state.pets.turtle) {
        completeQuest();
      }
      return;
    }

    // Normal tracking
    if (t.type !== type) return;
    if (t.what && t.what !== what && t.what !== 'any') return;
    state.questProgress = (state.questProgress || 0) + 1;
    if (state.questProgress >= (q.target || 1)) {
      completeQuest();
    } else {
      updateQuestWidget();
      saveGame();
    }
  }

  // Tap quest widget to re-hear the current prompt
  questWidget.addEventListener('click', () => {
    sfx.tap();
    speakCurrentQuestPrompt();
  });

  // -------- Grandma Moana NPC on Home Island --------
  // She lives on top of the home dome, waving and inviting players.
  // Drawn at offset relative to home island center.
  function drawGrandma(sx, sy) {
    const t = performance.now() / 600;
    const wave = Math.sin(t * 1.6) * 3;
    const bob = Math.sin(t) * 1.5;

    // Shadow
    ctx.fillStyle = 'rgba(0,30,60,0.30)';
    ctx.beginPath();
    ctx.ellipse(sx + 2, sy + 14, 14, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Sarong (dress)
    ctx.save();
    ctx.translate(sx, sy + bob);
    ctx.fillStyle = '#e91e63';
    ctx.beginPath();
    ctx.moveTo(-11, -2);
    ctx.quadraticCurveTo(-14, 12, -8, 14);
    ctx.lineTo(8, 14);
    ctx.quadraticCurveTo(14, 12, 11, -2);
    ctx.quadraticCurveTo(0, -4, -11, -2);
    ctx.fill();
    // Hibiscus dots on sarong
    ctx.fillStyle = '#fff8e1';
    [[-4, 4], [4, 7], [-2, 11], [6, 1], [-7, 9]].forEach(([px, py]) => {
      ctx.beginPath(); ctx.arc(px, py, 1.6, 0, Math.PI * 2); ctx.fill();
    });

    // Arms - one waving, one resting
    ctx.fillStyle = '#d7a673';
    // Resting arm
    ctx.beginPath();
    ctx.ellipse(-10, 2, 3, 6, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // Waving arm
    ctx.save();
    ctx.translate(10, -2);
    ctx.rotate(wave * 0.15 - 0.3);
    ctx.beginPath();
    ctx.ellipse(0, -3, 3, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    // Hand
    ctx.beginPath();
    ctx.arc(0, -9, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Head
    ctx.fillStyle = '#d7a673';
    ctx.beginPath();
    ctx.arc(0, -12, 8, 0, Math.PI * 2);
    ctx.fill();

    // White hair bun
    ctx.fillStyle = '#f5f5f5';
    ctx.beginPath();
    ctx.arc(0, -19, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-6, -14, 4, 0, Math.PI * 2);
    ctx.arc(6, -14, 4, 0, Math.PI * 2);
    ctx.fill();

    // Hibiscus flower in hair
    ctx.fillStyle = '#ff5252';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(6 + Math.cos(a) * 2.5, -17 + Math.sin(a) * 2.5, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(6, -17, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Eyes (closed-smile when waving)
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(-2.5, -12, 1.2, Math.PI * 1.05, Math.PI * 1.95, true);
    ctx.arc(2.5, -12, 1.2, Math.PI * 1.05, Math.PI * 1.95, true);
    ctx.stroke();

    // Big smile
    ctx.beginPath();
    ctx.arc(0, -10, 3, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.restore();
  }

  // -------- Treasure Book + Achievements --------
  const ITEM_META = {
    shell:          { icon: '🐚', name: 'Shell' },
    starfish:       { icon: '🌟', name: 'Starfish' },
    coral:          { icon: '🪸', name: 'Coral' },
    pearl:          { icon: '🦪', name: 'Pearl' },
    golden_conch:   { icon: '🐚', name: 'Golden Conch' },
    treasure_chest: { icon: '💎', name: 'Treasure' },
  };
  const FRIEND_META = {
    dolphin: { icon: '🐬', name: 'Dolphin', desc: 'Plus speed!' },
    turtle:  { icon: '🐢', name: 'Sea Turtle', desc: 'Plus cargo!' },
  };
  const ISLAND_ICONS = { home: '🏠', reef: '🐠', volcano: '🌋', pearl: '💎' };

  const bookBtn = document.getElementById('book-btn');
  const bookOverlay = document.getElementById('book-overlay');
  const bookContent = document.getElementById('book-content');
  const bookStats = document.getElementById('book-stats');
  let bookTab = 'items';

  function pulseBookButton() {
    bookBtn.classList.remove('pulse');
    void bookBtn.offsetWidth;
    bookBtn.classList.add('pulse');
  }

  function showAchievement(a) {
    sfx.upgrade();
    showToast(`🏆 ${a.name}!`);
    speak('Achievement!');
    pulseBookButton();
    spawnConfetti(boat.x, boat.y);
    spawnPopup(boat.x, boat.y, `🏆 ${a.name}`, '#fff176', true);
    shake(5, 14);
  }

  function checkAchievements() {
    let anyNew = false;
    for (const a of ACHIEVEMENTS) {
      if (state.unlockedAchievements[a.id]) continue;
      try {
        if (a.check()) {
          state.unlockedAchievements[a.id] = true;
          showAchievement(a);
          anyNew = true;
        }
      } catch (e) {}
    }
    if (anyNew) saveGame();
  }
  // Silent grant (used at load time — don't spam toasts/sounds)
  function syncAchievementsSilent() {
    for (const a of ACHIEVEMENTS) {
      if (state.unlockedAchievements[a.id]) continue;
      try { if (a.check()) state.unlockedAchievements[a.id] = true; } catch (e) {}
    }
  }

  function renderBook() {
    bookContent.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'book-grid';

    const speakCell = (name) => { sfx.tap(); speak(name); };

    if (bookTab === 'items') {
      for (const [type, meta] of Object.entries(ITEM_META)) {
        const count = state.totalCollected[type] || 0;
        const locked = count === 0;
        const cell = document.createElement('div');
        cell.className = 'book-cell' + (locked ? ' locked' : '');
        cell.innerHTML = `
          <div class="b-icon">${locked ? '❓' : meta.icon}</div>
          <div class="b-name">${locked ? '???' : meta.name}</div>
          <div class="b-count">${locked ? 'find one!' : 'x' + count}</div>
        `;
        cell.addEventListener('click', () => speakCell(locked ? 'A mystery!' : meta.name));
        grid.appendChild(cell);
      }
    } else if (bookTab === 'friends') {
      for (const [id, meta] of Object.entries(FRIEND_META)) {
        const owned = !!state.pets[id];
        const cell = document.createElement('div');
        cell.className = 'book-cell' + (owned ? '' : ' locked');
        cell.innerHTML = `
          <div class="b-icon">${owned ? meta.icon : '❓'}</div>
          <div class="b-name">${owned ? meta.name : '???'}</div>
          <div class="b-count">${owned ? meta.desc : 'find a friend!'}</div>
        `;
        cell.addEventListener('click', () => speakCell(owned ? meta.name : 'A mystery!'));
        grid.appendChild(cell);
      }
    } else if (bookTab === 'islands') {
      for (const isl of islands) {
        const visited = !!state.islandsVisited[isl.id];
        const cell = document.createElement('div');
        cell.className = 'book-cell' + (visited ? '' : ' locked');
        cell.innerHTML = `
          <div class="b-icon">${visited ? (ISLAND_ICONS[isl.id] || '🏝️') : '❓'}</div>
          <div class="b-name">${visited ? isl.name : '???'}</div>
          <div class="b-count">${visited ? '✓ visited' : (isl.unlocked ? 'sail there!' : 'locked')}</div>
        `;
        cell.addEventListener('click', () => speakCell(visited ? isl.name : 'A mystery island'));
        grid.appendChild(cell);
      }
    } else if (bookTab === 'badges') {
      for (const a of ACHIEVEMENTS) {
        const unlocked = !!state.unlockedAchievements[a.id];
        const cell = document.createElement('div');
        cell.className = 'book-cell' + (unlocked ? '' : ' locked');
        cell.innerHTML = `
          <div class="b-icon">${unlocked ? a.icon : '❓'}</div>
          <div class="b-name">${unlocked ? a.name : '???'}</div>
          <div class="b-locked">${unlocked ? a.desc : 'keep playing!'}</div>
        `;
        cell.addEventListener('click', () => speakCell(unlocked ? a.name : 'A mystery badge'));
        grid.appendChild(cell);
      }
    }
    bookContent.appendChild(grid);

    // Stats summary at the top of the book
    const unlockedBadges = Object.keys(state.unlockedAchievements).length;
    const totalBadges = ACHIEVEMENTS.length;
    const itemsFound = Object.keys(ITEM_META).filter(t => (state.totalCollected[t] || 0) > 0).length;
    const totalItems = Object.keys(ITEM_META).length;
    const islandsFound = islands.filter(i => state.islandsVisited[i.id]).length;
    const friends = (state.pets.dolphin ? 1 : 0) + (state.pets.turtle ? 1 : 0);
    bookStats.innerHTML = `
      🐚 ${itemsFound}/${totalItems} &nbsp;|&nbsp; 🐬 ${friends}/2 &nbsp;|&nbsp;
      🗺️ ${islandsFound}/${islands.length} &nbsp;|&nbsp; 🏆 ${unlockedBadges}/${totalBadges}
    `;
  }

  function openBook() {
    sfx.tap();
    state.bookOpen = true;
    bookTab = 'items';
    document.querySelectorAll('.book-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === 'items');
    });
    renderBook();
    bookOverlay.classList.add('visible');
  }
  function closeBook() {
    sfx.tap();
    state.bookOpen = false;
    bookOverlay.classList.remove('visible');
  }
  bookBtn.addEventListener('click', openBook);
  document.getElementById('book-close').addEventListener('click', closeBook);
  document.querySelectorAll('.book-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      sfx.tap();
      bookTab = btn.dataset.tab;
      document.querySelectorAll('.book-tab').forEach(b => b.classList.toggle('active', b === btn));
      renderBook();
    });
  });

  // -------- Island quick-travel bar --------
  const islandBarEl = document.getElementById('island-bar');
  // Friendly icons per island id
  const islandIcons = { home: '🏠', reef: '🐠', volcano: '🌋', pearl: '💎' };
  function updateIslandBar() {
    islandBarEl.innerHTML = '';
    for (const isl of islands) {
      const btn = document.createElement('button');
      btn.className = 'island-btn';
      if (state.autoSailTarget === isl) btn.classList.add('active');
      if (!isl.unlocked) {
        btn.disabled = true;
        btn.innerHTML = '<span class="ib-lock">🔒</span>';
      } else {
        btn.textContent = islandIcons[isl.id] || '🏝️';
      }
      btn.title = isl.unlocked ? isl.name : 'Locked';
      btn.addEventListener('click', () => {
        if (!isl.unlocked) { sfx.tap(); return; }
        sfx.tap();
        state.autoSailTarget = isl;
        state.target = null;
        showMsg(`Sailing to ${isl.name}…`);
        updateIslandBar();
      });
      islandBarEl.appendChild(btn);
    }
  }

  // -------- Mute button --------
  const muteBtn = document.getElementById('mute-btn');
  function refreshMuteIcon() { muteBtn.textContent = sfx.muted ? '🔇' : '🔊'; }
  muteBtn.addEventListener('click', () => {
    sfx.setMuted(!sfx.muted);
    refreshMuteIcon();
    saveGame();
  });

  // -------- Start --------
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (confirm('Start over? This will erase your treasures.')) {
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    }
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    // Init audio on user gesture (browser policy)
    sfx.init();
    sfx.startMusic();
    sfx.tap();
    // Load any saved progress
    loadGame();
    // Quietly catch up any achievements that should have unlocked already
    syncAchievementsSilent();
    refreshMuteIcon();
    updateIslandBar();
    // Tutorial only for brand-new players
    if (!state.tutorialSeen) {
      state.tutorial = { active: true, step: 0 };
      setTimeout(() => speak('Find a shell!'), 500);
    } else {
      // Returning player — show current quest and speak its prompt
      updateQuestWidget();
      const q = currentQuest();
      if (q) setTimeout(() => speakGrandma(q.prompt), 900);
    }
    document.getElementById('start-screen').style.display = 'none';
    state.started = true;
    showMsg(state.gold > 0 ? 'Welcome back, sailor!' : 'Sail out and gather treasures!');
  });

  // -------- Main loop --------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(now - last, 33) / 16.67;
    last = now;

    if (state.started && !state.shopOpen && !state.miniGameOpen && !state.bookOpen) {
      updateBoat(dt);
      updateItems();
      checkIsland();
      updateNPCShips();
      updateBoss();
    }
    updateNPCs();
    updateCamera();
    updateShake();
    updatePopups();
    updateItemPops();
    updateCoins();
    if (state.miniGameOpen) updateMiniGame();

    drawOcean();
    // World layer — affected by camera shake
    ctx.save();
    ctx.translate(cam.shakeX, cam.shakeY);
    drawWakeTrail();
    drawIslands();
    drawBossRing();
    drawWaypoint();
    drawItems();
    drawItemPops();
    drawFishes();
    drawWildCreatures();
    drawNPCShips();
    drawBoss();
    drawBoat();
    drawPets();
    drawSparkles();
    drawTutorial();
    ctx.restore();
    // UI / overlay layer — stable on screen
    drawPopups();
    drawClouds();
    drawCoins();
    drawBossArrow();
    drawCompass();

    updateHUD();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
